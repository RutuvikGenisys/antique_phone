name: Build and Package Docker Images - Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_REPO_ID: ${{ secrets.GAR_REPO_ID }}

jobs:
  build-and-push-staging: # Unique job name for staging build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker to use Google Artifact Registry
      run: gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev

    - name: Build and Push Backend Docker Image
      working-directory: backend
      run: |
        docker build -t ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO_ID}/backend-app:${GITHUB_SHA} .
        docker push ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO_ID}/backend-app:${GITHUB_SHA}

    - name: Build and Push Frontend Docker Image
      working-directory: frontend
      run: |
        docker build -t ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO_ID}/frontend-app:${GITHUB_SHA} .
        docker push ${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO_ID}/frontend-app:${GITHUB_SHA}