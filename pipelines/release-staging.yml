name: Deploy to Google Cloud Run - Staging

on:
  workflow_dispatch: # Allows manual trigger

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_REPO_ID: ${{ secrets.GAR_REPO_ID }}
  BACKEND_IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_ID }}/backend-app
  FRONTEND_IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_ID }}/frontend-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The corresponding build workflow (e.g., build-staging.yml for staging branch) must have run prior to this.
    # This workflow will use the GITHUB_SHA of the branch it is triggered from.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Deploy Backend to Cloud Run (Staging)
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: backend-api-staging # Staging service name
        image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        region: ${{ env.GCP_REGION }}
        env_vars: |
          MONGO_URI=${{ secrets.MONGO_URI_STAGING }} # Staging MongoDB URI

    - name: Deploy Frontend to Cloud Run (Staging)
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: frontend-app-staging # Staging service name
        image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        region: ${{ env.GCP_REGION }}
        # Example: Point frontend to staging backend
        # env_vars: |
        #   NEXT_PUBLIC_BACKEND_API_URL=https://backend-api-staging-xyz-uc.a.run.app